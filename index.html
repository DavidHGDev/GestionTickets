<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Tickets PRO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card-container">
    
    <nav class="top-toolbar">
        <button class="tool-btn" id="btn_abrir_plantillas" title="Abrir Gestor de Plantillas">📋 Plantillas</button>
        <a href="data.html" class="tool-btn" target="_blank">📊 Historial</a>
        <button class="tool-btn" id="btn_export_excel" title="Exportar a Excel">📊 Excel</button>
        <button class="tool-btn" id="btn_clear_data" title="Borrar DB Local">🗑️ Borrar DB</button>
        <button class="tool-btn" id="btn_import_data">📥 Importar</button>
        <input type="file" id="file_selector" style="display: none;" accept=".json, .csv">
    </nav>

    <div class="row col-2">
        <div class="floating-group">
            <input type="text" id="call_id" placeholder=" " autocomplete="off">
            <label>ID Llamada</label>
        </div>
        <div class="floating-group">
            <input type="text" id="customer_name" placeholder=" " autocomplete="off">
            <label>Nombre Cliente</label>
        </div>
    </div>

    <div class="row col-3">
        <div class="floating-group">
            <input type="number" id="customer_doc" placeholder=" " autocomplete="off">
            <label>Documento</label>
        </div>
        <div class="floating-group">
            <input type="tel" id="customer_phone" placeholder=" " autocomplete="off">
            <label>Teléfono</label>
        </div>
        <div class="floating-group">
            <input type="text" id="prueba_smnet" placeholder=" " autocomplete="off">
            <label>SMNET Int.</label>
        </div>
    </div>

    <div class="row col-3">
        <div class="floating-group">
            <input type="text" id="smnet_unitaria" placeholder=" " autocomplete="off">
            <label>SMNET Unit.</label>
        </div>
        
        <div class="input-wrapper">
            <div class="floating-group">
                <input type="text" id="tech_input" list="tech_options" placeholder=" " autocomplete="off">
                <label>Tecnología</label>
                <datalist id="tech_options"></datalist> 
            </div>
            <button class="clear-btn" tabindex="-1">✕</button>
        </div>
        
        <div class="input-wrapper">
            <div class="floating-group">
                <input type="text" id="prod_input" list="prod_options" placeholder=" " autocomplete="off">
                <label>Producto</label>
                <datalist id="prod_options"></datalist> 
            </div>
            <button class="clear-btn" tabindex="-1">✕</button>
        </div>
    </div>

    <div id="panel_internet" class="dynamic-panel">
        <div class="row col-2" style="margin-top:10px;">
            <div class="floating-group">
                <input type="text" id="soporte_velocidad" list="yes_no_options" value="Si" placeholder=" " autocomplete="off">
                <label>¿Equipo Soporta Velocidad?</label>
                <datalist id="yes_no_options"><option value="Si"><option value="No"></datalist>
            </div>
            <div id="mac_wrapper" class="floating-group hidden">
                <input type="text" id="mac_input" placeholder=" " autocomplete="off" style="text-transform:uppercase;">
                <label>MAC Módem (HFC)</label>
            </div>
        </div>
    </div>

    <div id="panel_tv" class="dynamic-panel tv-panel">
        <div class="floating-group" style="width: 120px; margin-top:10px;">
            <input type="number" id="tv_quantity" min="0" max="10" placeholder=" " autocomplete="off">
            <label>Cant. TVs</label>
        </div>
        <div id="tv_serials_container" class="tv-grid"></div>
    </div>

    <div class="row col-3">
        <div class="input-wrapper">
            <div class="floating-group">
                <input type="text" id="fail_input" list="fail_options" placeholder=" " autocomplete="off">
                <label>Dolor Puntual</label>
                <datalist id="fail_options"></datalist> 
            </div>
            <button class="clear-btn" tabindex="-1">✕</button>
        </div>

        <div class="floating-group">
            <input type="text" id="horario_falla" list="horario_options" placeholder=" " autocomplete="off">
            <label>Horario Falla</label>
            <datalist id="horario_options">
                <option value="Mañana (06-12)">
                <option value="Tarde (12-18)">
                <option value="Noche (18-22)">
                <option value="Todo el día">
            </datalist>
        </div>

        <div class="check-simple">
            <input type="checkbox" id="check_portal_cautivo">
            <label for="check_portal_cautivo" style="cursor:pointer; width:100%; height:100%; display:flex; align-items:center;">Portal Cautivo OK</label>
        </div>
    </div>

    <div class="floating-group">
        <textarea id="observaciones" placeholder=" " spellcheck="true"></textarea>
        <label>Observaciones</label>
    </div>

    <div class="actions">
        <button id="btn_copy">📋 Copiar Datos</button>
        <button id="btn_reset">💾 Guardar / Reset</button>
    </div>

    <div class="row" style="display: flex; gap: 10px; align-items: center; margin: 15px 0;">
        <div class="floating-group" style="flex: 1; margin: 0;">
            <textarea id="genesys_raw_data" placeholder=" " style="height: 42px; min-height: 42px; resize: none; overflow: hidden; padding-top: 12px; white-space: nowrap;"></textarea>
            <label>...</label>
        </div>
        <button type="button" id="btn_extraer_genesys" style="background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; height: 42px; white-space: nowrap;">Autocompletar</button>
    </div>

    <div style="display: none;">
        <input type="checkbox" id="check_notif_db">
        <input type="checkbox" id="check_venta_db">
        <button id="btn_toggle_notif"></button>
        <button id="btn_toggle_ventas"></button>
    </div>

    <div class="b2b-section">
        <div class="b2b-header">
            <span>🏢 Gestión B2B</span>
            <div class="radio-group">
                <label><input type="radio" name="b2b_option" value="no" checked> No</label>
                <label><input type="radio" name="b2b_option" value="si"> Si</label>
            </div>
        </div>

        <div id="b2b_panel" class="dynamic-panel" style="background: white; border-style: solid;">
            <div class="row col-2" style="margin-top:10px;">
                <div class="floating-group">
                    <input type="text" id="b2b_contact" placeholder=" " autocomplete="off">
                    <label>Nombre quien atiende</label>
                </div>
                <div class="floating-group">
                    <input type="tel" id="b2b_phone" placeholder=" " autocomplete="off">
                    <label>Celular</label>
                </div>
            </div>

            <div class="row">
                <div class="floating-group">
                    <input type="text" id="b2b_days" list="dias_options" placeholder=" " autocomplete="off">
                    <label>Días Atención</label>
                    <datalist id="dias_options">
                        <option value="Lunes a Viernes">
                        <option value="Lunes a Sábado">
                        <option value="Domingo a Domingo">
                    </datalist>
                </div>
            </div>
            
            <datalist id="list_horas_b2b">
                <option value="06:00 A.M."><option value="07:00 A.M."><option value="08:00 A.M.">
                <option value="09:00 A.M."><option value="10:00 A.M."><option value="11:00 A.M.">
                <option value="12:00 P.M."><option value="01:00 P.M."><option value="02:00 P.M.">
                <option value="03:00 P.M."><option value="04:00 P.M."><option value="05:00 P.M.">
                <option value="06:00 P.M."><option value="07:00 P.M."><option value="08:00 P.M.">
            </datalist>

            <div class="row col-2">
                <div class="floating-group input-compact">
                    <input type="text" id="b2b_start" list="list_horas_b2b" placeholder=" " autocomplete="off">
                    <label>Hora Inicio</label>
                </div>
                <div class="floating-group input-compact">
                    <input type="text" id="b2b_end" list="list_horas_b2b" placeholder=" " autocomplete="off">
                    <label>Hora Fin</label>
                </div>
            </div>

            <div id="b2b_sat_panel" class="b2b-subpanel hidden">
                <div class="check-row">
                    <input type="checkbox" id="check_sat_diff">
                    <label for="check_sat_diff">¿Sábado Diferente?</label>
                </div>
                <div id="sat_inputs" class="row col-2 hidden" style="margin-top:8px;">
                    <div class="floating-group input-compact"><input type="text" id="b2b_sat_start" list="list_horas_b2b" placeholder=" "><label>Inicio Sáb</label></div>
                    <div class="floating-group input-compact"><input type="text" id="b2b_sat_end" list="list_horas_b2b" placeholder=" "><label>Fin Sáb</label></div>
                </div>
            </div>

            <div id="b2b_sun_panel" class="b2b-subpanel hidden">
                <div class="check-row">
                    <input type="checkbox" id="check_sun_diff">
                    <label for="check_sun_diff">¿Domingo Diferente?</label>
                </div>
                <div id="sun_inputs" class="row col-2 hidden" style="margin-top:8px;">
                    <div class="floating-group input-compact"><input type="text" id="b2b_sun_start" list="list_horas_b2b" placeholder=" "><label>Inicio Dom</label></div>
                    <div class="floating-group input-compact"><input type="text" id="b2b_sun_end" list="list_horas_b2b" placeholder=" "><label>Fin Dom</label></div>
                </div>
            </div>

            <div class="b2b-subpanel">
                <div class="check-row">
                    <span style="font-weight:600; margin-right:10px;">¿Requiere Permiso?</span>
                    <label><input type="radio" name="permiso_opt" value="no" checked> No</label>
                    <label><input type="radio" name="permiso_opt" value="si"> Si</label>
                </div>
                <div id="permiso_input_panel" class="floating-group hidden" style="margin-top:8px;">
                    <input type="text" id="b2b_permiso_txt" placeholder=" ">
                    <label>¿Qué documento requiere?</label>
                </div>
            </div>
        </div>
    </div>

    <div class="key-bar">
        <button class="btn-key" id="btn_key_elite">Elite</button>
        <button class="btn-key" id="btn_key_fenix">Fenix</button>
        <button class="btn-key" id="btn_key_red">Red</button>
        <button class="btn-key" id="btn_key_wts">Wts</button>
        <button class="btn-key mod" id="btn_key_mod">⚙️</button>
        <button class="btn-key mod" id="btn_key_refres">⏱️</button>
        <button class="btn-key" id="btn_toggle_venta" title="Marcar venta ofrecida">Venta</button>
    </div>

    <!-- CUADRO EMERGENTE FLOTANTE (CRONÓMETRO) -->
    <div id="timer_widget" class="timer-widget hidden">
        <div id="timer_drag_header" class="timer-header">
            <span>⏱️ Cronómetro</span>
            <span id="btn_undock_timer" style="cursor:pointer; margin-left:10px;" title="Extraer a ventana siempre visible (PiP)">🪟</span>
        </div>
        <div class="timer-content">
            <div class="time-info">
                <div class="time-row">Total: <span id="display_total">00:00</span></div>
                <div class="time-row">Aviso: <span id="display_countdown" class="countdown">00:00</span></div>
            </div>
            <button type="button" id="btn_reset_countdown" class="btn-reset-timer" title="Reiniciar Contador">🔄</button>
        </div>
    </div>
    
    <div class="stats-container">
        <div class="stat-card">
            <span class="stat-label">AHT Diario</span>
            <span class="stat-value" id="aht_daily_display">0s / 0.0m</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">AHT Mensual</span>
            <span class="stat-value" id="aht_monthly_display">0s / 0.0m</span>
        </div>
    </div>

    <div class="footer-info">
        📂 Archivo excel para verificación de portal cautivo: 
        <span id="import_date_display">No importado</span>
    </div>
</div>

<!-- MODAL INTEGRADO DE PLANTILLAS OPTIMIZADO -->
<div id="modal_plantillas" class="modal-overlay hidden">
    <div class="modal-content" style="width: 95%; max-width: 850px; height: 95vh; display: flex; flex-direction: column; padding: 20px;">
        
        <!-- HEADER COMPACTO CON MENÚ DESPLEGABLE -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-shrink: 0;">
            <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                <span style="font-size: 1.6rem; color: var(--primary); cursor: pointer;" onclick="document.getElementById('select_plantilla').focus()">☰</span>
                <!-- El select actúa ahora como el título principal -->
                <select id="select_plantilla" style="width: 100%; max-width: 450px; font-size: 1.3rem; font-weight: bold; color: var(--primary); border: none; background: transparent; outline: none; cursor: pointer; appearance: auto;">
                    <option value="">Seleccionar Plantilla...</option>
                </select>
            </div>
            <button id="btn_cerrar_plantillas" class="btn-action" style="font-size: 1.5rem; cursor: pointer; border: none; background: none; color: #64748b; padding-left: 10px;">✕</button>
        </div>

        <!-- ESPACIO DE TRABAJO -->
        <div id="plantilla_workspace" class="hidden" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <!-- El formulario ocupa todo el espacio sobrante con su propio scroll -->
            <div id="plantilla_form" style="flex: 1; overflow-y: auto; padding-right: 10px; display: grid; gap: 12px; align-content: start;">
                <!-- Los campos se inyectan aquí -->
            </div>
            
            <!-- BOTONES SIEMPRE VISIBLES ABAJO -->
            <div class="modal-actions" style="margin-top: 15px; flex-shrink: 0; display: flex; gap: 15px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
                <button id="btn_copiar_plantilla" class="btn-key" style="flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; font-size: 1.1rem; padding: 12px; font-weight: bold; transition: 0.2s; border-radius: 8px;">📋 Copiar</button>
                <button id="btn_insertar_plantilla" class="btn-key" style="flex: 1; background: #dbeafe; border: 1px solid #93c5fd; color: #1e40af; font-size: 1.1rem; padding: 12px; font-weight: bold; transition: 0.2s; border-radius: 8px;">⬇️ Insertar y Salir</button>
            </div>
        </div>
        
        <!-- ESTADO VACÍO (Cuando no hay plantilla seleccionada) -->
        <div id="plantilla_vacia" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8;">
            <span style="font-size: 3rem; margin-bottom: 10px;">👆</span>
            <p style="font-size: 1.1rem; font-weight: 600;">Selecciona una plantilla en el menú superior</p>
        </div>
        
    </div>
</div>

<div id="modal_claves" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="margin-bottom:15px; color:#1e3a8a;">Configurar Claves</h3>
        <div class="form-group-modal">
            <label>Elite</label>
            <input type="password" id="edit_key_elite">
        </div>
        <div class="form-group-modal">
            <label>Fenix</label>
            <input type="password" id="edit_key_fenix">
        </div>
        <div class="form-group-modal">
            <label>Red</label>
            <input type="password" id="edit_key_red">
        </div>
        <div class="form-group-modal">
            <label>Wts-</label>
            <input type="password" id="edit_key_wts">
        </div>
        <div class="modal-actions">
            <button id="btn_cancelar_modal" class="btn-key">Cancelar</button>
            <button id="btn_guardar_modal" class="btn-key" style="background:#dcfce7; border-color:#86efac; color:#166534;">Guardar</button>
        </div>
    </div>
</div>

<!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
    <div id="toast_container"></div>

    <!-- MODAL DE CONFIRMACIÓN ELEGANTE -->
    <div id="custom_confirm" class="modal-overlay hidden">
        <div class="modal-content" style="text-align: center; width: 340px;">
            <div style="font-size: 3rem; margin-bottom: 10px;">⚠️</div>
            <h3 style="color: #1e293b; margin-bottom: 15px; font-size: 1.1rem;" id="confirm_msg">¿Estás seguro?</h3>
            <div class="modal-actions" style="justify-content: center; gap: 15px;">
                <button id="btn_confirm_no" class="btn-key" style="padding: 10px 25px;">Cancelar</button>
                <button id="btn_confirm_si" class="btn-key" style="background:#fee2e2; border-color:#fca5a5; color:#b91c1c; padding: 10px 25px;">Confirmar</button>
            </div>
        </div>
    </div>

<script src="js/db.js"></script> 
<script src="js/app.js"></script>
<script src="js/exportarData.js"></script>
<script src="js/logicaTemplate.js"></script>

</body>
</html>
